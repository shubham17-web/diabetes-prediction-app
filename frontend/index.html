<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Diabetes Prediction</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Diabetes Prediction</h1>
      <p>Enter patient information to estimate diabetes risk</p>
    </div>

    <form id="predictionForm">
      <div class="form-grid">
        <div class="field">
          <label for="Pregnancies">Pregnancies</label>
          <input type="number" id="Pregnancies" placeholder="0–20" min="0" max="20" step="1" required />
        </div>

        <div class="field">
          <label for="Glucose">Glucose</label>
          <div class="input-unit">
            <input type="number" id="Glucose" placeholder="40–600" min="40" max="600" step="1" required>
            <span>mg/dL</span>
            <small class="input-error" id="Glucose-error"></small>
          </div>
        </div>

        <div class="field">
          <label for="BloodPressure">Blood Pressure</label>
          <div class="input-unit">
            <input type="number" id="BloodPressure" placeholder="30–200" min="30" max="200" step="1" required>
            <span>mmHg</span>
            <small class="input-error" id="BloodPressure-error"></small>
          </div>
        </div>

        <div class="field">
          <label for="SkinThickness">Skin Thickness</label>
          <div class="input-unit">
            <input type="number" id="SkinThickness" placeholder="1–100" min="1" max="100" step="1" required>
            <span>mm</span>
            <small class="input-error" id="SkinThickness-error"></small>
          </div>
        </div>

        <div class="field">
          <label for="Insulin">Insulin</label>
          <div class="input-unit">
            <input type="number" id="Insulin" placeholder="0–1000" min="0" max="1000" step="1" required>
            <span>μU/mL</span>
            <small class="input-error" id="Insulin-error"></small>
          </div>
        </div>

        <div class="field">
          <label for="BMI">BMI</label>
          <div class="input-unit">
            <input type="number" id="BMI" placeholder="10–70" min="10" max="70" step="0.1" required>
            <span>kg/m²</span>
            <small class="input-error" id="BMI-error"></small>
          </div>
        </div>

        <div class="field">
          <label for="DiabetesPedigreeFunction">
            Diabetes Pedigree Function
          </label>
          <div class="input-unit">
            <input type="number" id="DiabetesPedigreeFunction" placeholder="0–3" min="0" max="3" step="0.001" required>
            <small class="input-error" id="DiabetesPedigreeFunction-error"></small>
          </div>
        </div>

        <div class="field">
          <label for="Age">Age</label>
          <div class="input-unit">
            <input type="number" id="Age" placeholder="18–100" min="18" max="100" step="1" required>
            <span>years</span>
            <small class="input-error" id="Age-error"></small>
          </div>
        </div>
      </div>

      <button type="submit" id="predictButton">Predict Diabetes</button>

      <div class="button-group">
        <button type="button" id="clearInputsButton" class="clear-inputs-button">
          Clear Inputs
        </button>
      </div>
    </form>

    <div id="result"></div>

    <section class="history-section">
      <div class="history-header">
        <h2>Prediction History</h2>

        <button type="button" id="clearHistoryButton" class="clear-button">
          Clear History
        </button>
      </div>

      <div id="history">Loading history...</div>
    </section>
  </div>

  <script src="script.js"></script>
</body>

</html>
